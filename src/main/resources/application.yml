spring:
  application:
    name: onti-api
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/onti
    username: onti
    password: onti
  servlet:
    multipart:
      max-file-size: 10MB
      # 사진 여러 장을 한 요청에 담을 수 있어 요청 전체 한도는 넉넉히 둔다.
      max-request-size: 50MB

onti:
  upload:
    # 서버 로컬 디스크에 저장한다 — 운영에서는 S3로 교체 예정.
    dir: ${ONTI_UPLOAD_DIR:uploads}
    max-bytes: 10485760

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-please-change-before-prod-1234567890}
  expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
