server:
  # 배포 플랫폼(Railway/Render 등)은 실행할 때 PORT로 포트를 지정한다. 이 값을
  # 따르지 않으면 플랫폼이 앱을 못 찾아 배포가 실패한다.
  port: ${PORT:8080}

spring:
  application:
    name: onti-api
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  datasource:
    # 로컬은 그대로 localhost:5432/onti. 배포 환경(Render 등)은 DB_HOST/DB_PORT/
    # DB_NAME/DB_USER/DB_PASSWORD를 넣어주면 됨 — 플랫폼마다 DB 접속 정보를
    # 하나로 합친 문자열(postgres://...)로 주는 경우가 많아서 JDBC 형식과 안 맞음,
    # 그래서 부분별로 받아 여기서 조립함.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onti}
    username: ${DB_USER:onti}
    password: ${DB_PASSWORD:onti}
  servlet:
    multipart:
      max-file-size: 10MB
      # 사진 여러 장을 한 요청에 담을 수 있어 요청 전체 한도는 넉넉히 둔다.
      max-request-size: 50MB

onti:
  cors:
    # 브라우저에서 이 API를 부를 수 있는 출처. 쉼표로 구분하며 와일드카드를 쓸
    # 수 있다(*.vercel.app은 preview 배포마다 주소가 바뀌어서 필요하다).
    allowed-origins: ${ONTI_CORS_ORIGINS:http://localhost:3000,https://onti-blue.vercel.app,https://*.vercel.app}
  upload:
    # 서버 로컬 디스크에 저장한다 — 운영에서는 S3로 교체 예정.
    dir: ${ONTI_UPLOAD_DIR:uploads}
    max-bytes: 10485760

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-please-change-before-prod-1234567890}
  expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
